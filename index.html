<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Задачник</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://googleapis.com" rel="stylesheet">
</head>
<body>
    <main class="todo-container">
        <div class="sidebar-menu">
            <div class="sidebar-profile">
                <h3>Меню</h3>
            </div>
            <ul class="sidebar-links">
                <li><a href="#">🎨 Настройки и Стили</a></li>
                <li><a href="#">📅 Календарь</a></li>
                <li><a href="#">🎯 Цели на период</a></li>
                <li><a href="#">📋 План на неделю</a></li>
                <li><a href="#">⏱️ Многозадачный таймер</a></li>
                <li><a href="#">🔔 Таймер привычек</a></li>
            </ul>
            </div>
                    

        <header class="todo-header">
             <input type="checkbox" id="menu-toggle" class="menu-toggle-input">
            <div class="app-header">
                <label for="menu-toggle" class="menu-btn">&#9776</label>
            <div class="header-content">
                <h1>Мои цели 📝</h1>
            </div>
            </div>
            <p>План на день</p>
        </header>
        <section class="todo-form">
            <input type="text" placeholder="Какая цель на сегодня?">
            <button type="button">Добавить</button>
        </section>
        <section class="tasks-section">
            <ul class="tasks-list">
                <li>
                    <span class="task-number">#1</span>
                    <input type="checkbox" id="task1">
                    <label for="task1">упражнение вакуум</label>
                </li>
                <li>
                    <span class="task-number">#2</span>
                    <input type="checkbox" id="task2">
                    <label for="task2">умывание холодной водой</label>
                </li>
                <li>
                    <span class="task-number">#3</span>
                    <input type="checkbox" id="task3">
                    <label for="task3">стакан тёплой воды</label>
                </li>
                <li>
                    <span class="task-number">#4</span>
                    <input type="checkbox" id="task4">
                    <label for="task4">английский язык</label>
                </li>
                <li>
                    <span class="task-number">#5</span>
                    <input type="checkbox" id="task5">
                    <label for="task5">программирование</label>
                </li>
                <li>
                    <span class="task-number">#6</span>
                    <input type="checkbox" id="task6">
                    <label for="task6">слепая печать</label>
                </li>
                <li>
                    <span class="task-number">#7</span>
                    <input type="checkbox" id="task7">
                    <label for="task7">тренеровка позвоночника</label>
                </li>
                <li>
                    <span class="task-number">#8</span>
                    <input type="checkbox" id="task8">
                    <label for="task8">тренеровка ИЛИ апеоэ</label>
                </li>
                <li>
                    <span class="task-number">#9</span>
                    <input type="checkbox" id="task9">
                    <label for="task9">упражнения речи + звук "р"</label>
                </li>
                <li>
                    <span class="task-number">#10</span>
                    <input type="checkbox" id="task10">
                    <label for="task10">упражнения Кегеля</label>
                </li>
                <li>
                    <span class="task-number">#11</span>
                    <input type="checkbox" id="task11">
                    <label for="task11">3л воды в день</label>
                </li>
                <li>
                    <span class="task-number">12:</span>
                    <input type="checkbox" id="task12">
                    <label for="task12">сон 9 часов с прошлого дня</label>
                </li>
                <li>
                    <span class="task-number">#13</span>
                    <input type="checkbox" id="task13">
                    <label for="task13">умывание уходовыми средствами</label>
                </li> 
            </ul>
        </section>                       

    </main>    
</body>
</html>
